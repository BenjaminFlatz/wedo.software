<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeDo Software - Bildung & Wissensvermittlung</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50">
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const Navbar = () => (
      <nav className="bg-white shadow-lg py-4 px-6 fixed w-full z-20">
        <div className="container mx-auto flex justify-between items-center">
          <h1 className="text-2xl font-bold text-gray-800">WeDo Software</h1>
          <div className="space-x-8 text-gray-600">
            <a href="#topics" className="hover:text-blue-500 transition">Themen</a>
            <a href="#about" className="hover:text-blue-500 transition">Über uns</a>
            <a href="#contact" className="hover:text-blue-500 transition">Kontakt</a>
            <a href="impressum.html" className="hover:text-blue-500 transition">Impressum</a>
          </div>
        </div>
      </nav>
    );

    const Hero = () => (
      <section className="bg-gradient-to-br from-blue-700 via-indigo-600 to-purple-600 text-white min-h-screen flex items-center justify-center pt-16">
        <div className="container mx-auto text-center px-6 animate-fade-in">
          <h2 className="text-4xl md:text-6xl font-extrabold mb-6 leading-tight">Lernen Sie Software-Entwicklung mit WeDo</h2>
          <p className="text-lg md:text-xl mb-8 max-w-2xl mx-auto">Tutorials, Videos und Lerninhalte zu IT-Consulting, KI, Web Scraping und Python – praxisnah und verständlich erklärt.</p>
          <a href="#topics" className="bg-white text-blue-700 px-8 py-3 rounded-full font-semibold hover:bg-blue-100 transition duration-300">Jetzt durchstarten</a>
        </div>
      </section>
    );

    const TopicCard = ({ title, description, icon }) => (
      <div className="bg-white p-8 rounded-xl shadow-md hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 animate-slide-up">
        <div className="text-blue-600 text-5xl mb-4">{icon}</div>
        <h3 className="text-xl font-bold text-gray-800 mb-3">{title}</h3>
        <p className="text-gray-600">{description}</p>
      </div>
    );

    const Topics = () => (
      <section id="topics" className="py-20 bg-gray-100">
        <div className="container mx-auto px-6">
          <h2 className="text-3xl md:text-4xl font-extrabold text-center text-gray-800 mb-12 animate-fade-in">Unsere Lernthemen</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            <TopicCard 
              title="IT-Consulting Grundlagen" 
              description="Lernen Sie die Prinzipien professioneller IT-Beratung und wie Sie digitale Strategien entwickeln."
              icon="🛠️"
            />
            <TopicCard 
              title="KI & Machine Learning" 
              description="Verstehen Sie KI-Konzepte und lernen Sie, eigene Machine Learning Modelle zu trainieren."
              icon="🤖"
            />
            <TopicCard 
              title="Web Scraping Techniken" 
              description="Meistern Sie die Kunst der automatisierten Datenextraktion aus Webseiten mit Python."
              icon="🌐"
            />
            <TopicCard 
              title="Python-Programmierung" 
              description="Von den Basics bis zu fortgeschrittenen Themen – lernen Sie Python Schritt für Schritt."
              icon="🐍"
            />
          </div>
        </div>
      </section>
    );

    const About = () => (
      <section id="about" className="py-20 bg-white">
        <div className="container mx-auto px-6">
          <h2 className="text-3xl md:text-4xl font-extrabold text-center text-gray-800 mb-12 animate-fade-in">Über WeDo Software</h2>
          <p className="text-lg text-gray-600 text-center max-w-3xl mx-auto animate-slide-up mb-6">
            WeDo Software ist Ihre Plattform für praxisnahe Bildung im Bereich Software-Entwicklung und Informatik. Wir erstellen Tutorials, Videos und Lerninhalte, die komplexe Themen verständlich machen.
          </p>
          <p className="text-lg text-gray-600 text-center max-w-3xl mx-auto animate-slide-up">
            Unser Ziel ist es, Wissen zu vermitteln und Menschen dabei zu unterstützen, ihre Fähigkeiten in der IT-Welt weiterzuentwickeln – egal ob Anfänger oder Fortgeschrittene.
          </p>
        </div>
      </section>
    );

    const Contact = () => (
      <section id="contact" className="py-20 bg-gray-100">
        <div className="container mx-auto px-6">
          <h2 className="text-3xl md:text-4xl font-extrabold text-center text-gray-800 mb-12 animate-fade-in">Haben Sie Fragen?</h2>
          <p className="text-center text-gray-600 mb-8 max-w-2xl mx-auto">
            Möchten Sie mehr über unsere Lerninhalte erfahren oder haben Sie Themenvorschläge? Schreiben Sie uns eine Nachricht!
          </p>
          <div className="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg animate-slide-up">
            <form action="https://formspree.io/f/xpwykbke" method="POST" className="space-y-6">
              <input 
                type="text" 
                name="name"
                placeholder="Name" 
                required
                className="w-full p-4 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition" 
              />
              <input 
                type="email" 
                name="email"
                placeholder="E-Mail" 
                required
                className="w-full p-4 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition" 
              />
              <textarea 
                name="message"
                placeholder="Ihre Nachricht oder Themenwunsch" 
                required
                className="w-full p-4 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition" 
                rows="5"
              ></textarea>
              <button 
                type="submit" 
                className="w-full bg-blue-600 text-white p-4 rounded-lg font-semibold hover:bg-blue-700 transition duration-300"
              >
                Nachricht senden
              </button>
            </form>
          </div>
        </div>
      </section>
    );

    const Footer = () => (
      <footer className="bg-gray-900 text-white py-8">
        <div className="container mx-auto px-6 text-center">
          <p className="text-sm mb-2">&copy; 2025 WeDo Software. Alle Rechte vorbehalten.</p>
          <p className="text-sm">
            <a href="impressum.html" className="hover:text-blue-400 transition">Impressum</a>
          </p>
        </div>
      </footer>
    );

    const App = () => (
      <div>
        <Navbar />
        <Hero />
        <Topics />
        <About />
        <Contact />
        <Footer />
      </div>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
