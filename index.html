<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="icon.png" type="image/png">
  <title>WeDo Software - Bildung & Wissensvermittlung</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script type="text/babel" src="footer.js"></script>
</head>

<body class="bg-gray-50">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React; {/* Added useEffect and useRef for Three.js integration */ }

   const Navbar = () => (
      <nav className="bg-white shadow-lg py-4 px-6 fixed w-full z-20">
        <div className="container mx-auto flex justify-between items-center">
          <div className="flex items-center space-x-2">  {/* Added wrapper for logo and text */}
            <img src="icon.png" alt="WeDo Software Logo" className="h-8 w-8" />  {/* Added logo image */}
            <h1 className="text-2xl font-bold text-gray-800">WeDo Software</h1>
          </div>
          <div className="space-x-8 text-gray-600">
            <a href="#topics" className="hover:text-blue-500 transition">Themen</a>
            <a href="#about" className="hover:text-blue-500 transition">Über uns</a>
            <a href="#contact" className="hover:text-blue-500 transition">Kontakt</a>
            <a href="impressum.html" className="hover:text-blue-500 transition">Impressum</a>
          </div>
        </div>
      </nav>
    );

      const Hero = () => {
      const canvasRef = useRef(null);
      const [scrollY, setScrollY] = useState(0);

      useEffect(() => {
        const handleScroll = () => setScrollY(window.scrollY);
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      useEffect(() => {
        if (!canvasRef.current || typeof THREE === 'undefined') {
          console.error('Three.js not loaded or canvas ref missing');
          return;
        }

        // Set up Three.js scene with dark space theme
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000022);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvasRef.current, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        const pointLight = new THREE.PointLight(0xffffff, 1, 100);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        const nodes = [];
        const edges = [];
        const nodeCount = 50;
        const geometry = new THREE.SphereGeometry(0.1, 32, 32);
        const material = new THREE.MeshPhongMaterial({ color: 0x00ffff, shininess: 100 });

        for (let i = 0; i < nodeCount; i++) {
          const node = new THREE.Mesh(geometry, material);
          node.position.set(
            (Math.random() - 0.5) * 20,
            (Math.random() - 0.5) * 20,
            (Math.random() - 0.5) * 20
          );
          node.userData = {
            initialY: node.position.y,
            initialScale: 1,
            phase: Math.random() * Math.PI * 2  // Random phase for varied oscillation
          };
          scene.add(node);
          nodes.push(node);
        }

        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xaaaaaa, transparent: true, opacity: 0.5 });
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            if (Math.random() > 0.6) {
              const points = [nodes[i].position, nodes[j].position];
              const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
              const line = new THREE.Line(lineGeometry, lineMaterial);
              scene.add(line);
              edges.push(line);
            }
          }
        }

        // Add star particles
        const starCount = 200;
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i += 3) {
          starPositions[i] = (Math.random() - 0.5) * 100;
          starPositions[i + 1] = (Math.random() - 0.5) * 100;
          starPositions[i + 2] = (Math.random() - 0.5) * 100;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        camera.position.z = 25;

        // Animation loop with analog-like smooth movement
        let lastTime = 0;
        let smoothedMorphFactor = 0;  // For easing the morph factor changes
        const animate = (time) => {
          requestAnimationFrame(animate);
          const delta = (time - lastTime) / 1000;
          lastTime = time;

          // Smoother rotation
          scene.rotation.y += 0.0005 * delta * 60;
          scene.rotation.x += 0.0002 * delta * 60;

          // Smooth morph factor with easing (analog-like transition)
          const targetMorphFactor = scrollY / window.innerHeight;
          smoothedMorphFactor += (targetMorphFactor - smoothedMorphFactor) * 0.1;  // Ease towards target (0.1 = easing speed)

          nodes.forEach((node, index) => {
            // Analog oscillation: Set position relative to initial (no accumulation)
            const oscillation = Math.sin(time * 0.0005 + node.userData.phase) * 1 * (1 + smoothedMorphFactor);
            node.position.y = node.userData.initialY + oscillation;

            // Smooth scale interpolation
            const targetScale = 1 + smoothedMorphFactor * 0.3;
            node.scale.setScalar(node.scale.x + (targetScale - node.scale.x) * 0.1);  // Ease scale
          });

          // Smooth star rotation
          stars.rotation.y += 0.0001 * delta * 60;

          renderer.render(scene, camera);
        };
        animate(0);

        // Handle resize
        const handleResize = () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', handleResize);
        return () => window.removeEventListener('resize', handleResize);
      }, []);  // Removed [scrollY] to prevent re-setup on scroll; loop handles updates smoothly

      return (
        <section className="relative min-h-screen flex items-center justify-center pt-16 overflow-hidden bg-black">
          <canvas ref={canvasRef} className="absolute top-0 left-0 w-full h-full" />
          <div className="container mx-auto text-center px-6 animate-fade-in z-10 text-white">
            <h2 className="text-4xl md:text-6xl font-extrabold mb-6 leading-tight">Lernen Sie Software-Entwicklung mit WeDo</h2>
            <p className="text-lg md:text-xl mb-8 max-w-2xl mx-auto">Tutorials, Videos und Lerninhalte zu IT-Consulting, KI, Web Scraping und Python – praxisnah und verständlich erklärt.</p>
            <a href="#topics" className="bg-white text-blue-700 px-8 py-3 rounded-full font-semibold hover:bg-blue-100 transition duration-300">Jetzt durchstarten</a>
          </div>
        </section>
      );
    };

    const TopicCard = ({ title, description, icon }) => (
      <div className="bg-white p-8 rounded-xl shadow-md hover:shadow-2xl transition-all duration-300 transform hover:-translate-y-2 animate-slide-up">
        <div className="text-blue-600 text-5xl mb-4">{icon}</div>
        <h3 className="text-xl font-bold text-gray-800 mb-3">{title}</h3>
        <p className="text-gray-600">{description}</p>
      </div>
    );

    const Topics = () => (
      <section id="topics" className="py-20 bg-gray-100">
        <div className="container mx-auto px-6">
          <h2 className="text-3xl md:text-4xl font-extrabold text-center text-gray-800 mb-12 animate-fade-in">Unsere Lernthemen</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            <TopicCard
              title="IT-Consulting Grundlagen"
              description="Lernen Sie die Prinzipien professioneller IT-Beratung und wie Sie digitale Strategien entwickeln."
              icon="🛠️"
            />
            <TopicCard
              title="KI & Machine Learning"
              description="Verstehen Sie KI-Konzepte und lernen Sie, eigene Machine Learning Modelle zu trainieren."
              icon="🤖"
            />
            <TopicCard
              title="Web Scraping Techniken"
              description="Meistern Sie die Kunst der automatisierten Datenextraktion aus Webseiten mit Python."
              icon="🌐"
            />
            <TopicCard
              title="Python-Programmierung"
              description="Von den Basics bis zu fortgeschrittenen Themen – lernen Sie Python Schritt für Schritt."
              icon="🐍"
            />
          </div>
        </div>
      </section>
    );

    const About = () => (
      <section id="about" className="py-20 bg-white">
        <div className="container mx-auto px-6">
          <h2 className="text-3xl md:text-4xl font-extrabold text-center text-gray-800 mb-12 animate-fade-in">Über WeDo Software</h2>
          <p className="text-lg text-gray-600 text-center max-w-3xl mx-auto animate-slide-up mb-6">
            WeDo Software ist Ihre Plattform für praxisnahe Bildung im Bereich Software-Entwicklung und Informatik. Wir erstellen Tutorials, Videos und Lerninhalte, die komplexe Themen verständlich machen.
          </p>
          <p className="text-lg text-gray-600 text-center max-w-3xl mx-auto animate-slide-up">
            Unser Ziel ist es, Wissen zu vermitteln und Menschen dabei zu unterstützen, ihre Fähigkeiten in der IT-Welt weiterzuentwickeln – egal ob Anfänger oder Fortgeschrittene.
          </p>
        </div>
      </section>
    );

    const Contact = () => (
      <section id="contact" className="py-20 bg-gray-100">
        <div className="container mx-auto px-6">
          <h2 className="text-3xl md:text-4xl font-extrabold text-center text-gray-800 mb-12 animate-fade-in">Haben Sie Fragen?</h2>
          <p className="text-center text-gray-600 mb-8 max-w-2xl mx-auto">
            Möchten Sie mehr über unsere Lerninhalte erfahren oder haben Sie Themenvorschläge? Schreiben Sie uns eine Nachricht!
          </p>
          <div className="max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg animate-slide-up">
            <form action="https://formspree.io/f/xpwykbke" method="POST" className="space-y-6">
              <input
                type="text"
                name="name"
                placeholder="Name"
                required
                className="w-full p-4 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
              />
              <input
                type="email"
                name="email"
                placeholder="E-Mail"
                required
                className="w-full p-4 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
              />
              <textarea
                name="message"
                placeholder="Ihre Nachricht oder Themenwunsch"
                required
                className="w-full p-4 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                rows="5"
              ></textarea>
              <button
                type="submit"
                className="w-full bg-blue-600 text-white p-4 rounded-lg font-semibold hover:bg-blue-700 transition duration-300"
              >
                Nachricht senden
              </button>
            </form>
          </div>
        </div>
      </section>
    );

    const App = () => (
      <div>
        <Navbar />
        <Hero />
        <Topics />
        <About />
        <Contact />
        <Footer />
      </div>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
