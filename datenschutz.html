<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="alternate icon" href="icon.png" type="image/png">
  <title>Privacy Policy - wedo-software.com</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="text/babel" src="footer.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#05060a]">
  <div id="root"></div>
  <script type="text/babel">
    const Navbar = () => (
      <nav className="glass-panel fixed w-full z-30 py-4 px-6">
        <div className="container mx-auto flex justify-between items-center">
          <a href="index.html" className="flex items-center space-x-3">
            <img src="logo.svg" alt="wedo-software.com logo" className="h-9 w-9" />
            <span className="text-xl font-bold text-white tracking-tight">wedo-software<span className="text-cyan-400">.com</span></span>
          </a>
          <div className="space-x-8 text-gray-300">
            <a href="index.html#expertise" className="hover:text-cyan-400 transition">Expertise</a>
            <a href="index.html#tech-stack" className="hover:text-cyan-400 transition">Tech Stack</a>
            <a href="index.html#projects" className="hover:text-cyan-400 transition">Projects</a>
            <a href="index.html#contact" className="hover:text-cyan-400 transition">Contact</a>
          </div>
        </div>
      </nav>
    );

    const DatenschutzContent = () => (
      <section className="pt-32 pb-20 min-h-screen">
        <div className="container mx-auto px-6 max-w-4xl">
          <h1 className="text-4xl md:text-5xl font-extrabold text-white mb-12 text-center animate-fade-in">
            Privacy Policy
          </h1>

          <div className="glass-card p-8 rounded-2xl animate-slide-up space-y-8">

            {/* Introduction */}
            <div>
              <p className="text-gray-300 leading-relaxed mb-4">
                Protecting your personal data is important to us. This privacy policy informs you which personal data we collect, for what purposes, and on what legal basis.
              </p>
              <p className="text-gray-300 leading-relaxed">
                Last updated: January 2025
              </p>
            </div>

            {/* Controller */}
            <div>
              <h2 className="text-2xl font-bold text-white mb-4 border-b-2 border-cyan-500 pb-2">
                1. Data Controller
              </h2>
              <p className="text-gray-300 leading-relaxed">
                The controller responsible for data processing on this website is:<br /><br />
                Benjamin Flatz<br />
                Eisengasse 25<br />
                6850 Dornbirn, Austria<br />
                Email: <a href="mailto:info@wedo-software.com" className="text-cyan-400 hover:text-cyan-300 transition">info@wedo-software.com</a><br />
                Phone: +43 664 4040185
              </p>
            </div>

            {/* Collection and Storage */}
            <div>
              <h2 className="text-2xl font-bold text-white mb-4 border-b-2 border-cyan-500 pb-2">
                2. Collection and Storage of Personal Data
              </h2>

              <h3 className="text-xl font-semibold text-white mt-6 mb-3">
                2.1 When Visiting the Website
              </h3>
              <p className="text-gray-300 leading-relaxed mb-4">
                Every time our website is accessed, our system automatically collects data and information from the accessing device. The following data is collected:
              </p>
              <ul className="list-disc list-inside text-gray-300 leading-relaxed mb-4 ml-4">
                <li>IP address of the user</li>
                <li>Date and time of access</li>
                <li>Pages accessed</li>
                <li>Browser type and version</li>
                <li>Operating system used</li>
                <li>Referrer URL (previously visited page)</li>
              </ul>
              <p className="text-gray-300 leading-relaxed">
                This data is stored in our system's log files. This data is not stored together with other personal data of the user. The legal basis is Art. 6(1)(f) GDPR (legitimate interest in system security).
              </p>

              <h3 className="text-xl font-semibold text-white mt-6 mb-3">
                2.2 Contact Form
              </h3>
              <p className="text-gray-300 leading-relaxed mb-4">
                When you use our contact form, the following data is collected:
              </p>
              <ul className="list-disc list-inside text-gray-300 leading-relaxed mb-4 ml-4">
                <li>Name</li>
                <li>Email address</li>
                <li>Message content</li>
              </ul>
              <p className="text-gray-300 leading-relaxed">
                Data processing is based on your consent (Art. 6(1)(a) GDPR). The data is used exclusively to process your inquiry and is deleted afterwards, unless statutory retention obligations apply.
              </p>
            </div>

            {/* Formspree */}
            <div>
              <h2 className="text-2xl font-bold text-white mb-4 border-b-2 border-cyan-500 pb-2">
                3. Formspree
              </h2>
              <p className="text-gray-300 leading-relaxed mb-4">
                Our contact form uses the Formspree service (Formspree Inc., USA) to process form submissions. When you submit the form, your entered data is transmitted to Formspree and forwarded from there to our email address.
              </p>
              <p className="text-gray-300 leading-relaxed mb-4">
                Formspree processes the following data:
              </p>
              <ul className="list-disc list-inside text-gray-300 leading-relaxed mb-4 ml-4">
                <li>Form data you entered (name, email, message)</li>
                <li>IP address</li>
                <li>Timestamp of submission</li>
              </ul>
              <p className="text-gray-300 leading-relaxed mb-4">
                The legal basis for using Formspree is your consent (Art. 6(1)(a) GDPR), which you grant by submitting the form.
              </p>
              <p className="text-gray-300 leading-relaxed">
                For more information, see Formspree's privacy policy:
                <a href="https://formspree.io/legal/privacy-policy/" target="_blank" rel="noopener noreferrer" className="text-cyan-400 hover:text-cyan-300 transition ml-1">
                  https://formspree.io/legal/privacy-policy/
                </a>
              </p>
            </div>

            {/* Cookies */}
            <div>
              <h2 className="text-2xl font-bold text-white mb-4 border-b-2 border-cyan-500 pb-2">
                4. Cookies
              </h2>
              <p className="text-gray-300 leading-relaxed">
                Our website currently does not use cookies. Should this change, we will inform you accordingly at this point.
              </p>
            </div>

            {/* External Services */}
            <div>
              <h2 className="text-2xl font-bold text-white mb-4 border-b-2 border-cyan-500 pb-2">
                5. Integration of External Services
              </h2>

              <h3 className="text-xl font-semibold text-white mt-6 mb-3">
                5.1 Content Delivery Networks (CDN)
              </h3>
              <p className="text-gray-300 leading-relaxed mb-4">
                This website uses the following CDN services to quickly load libraries:
              </p>
              <ul className="list-disc list-inside text-gray-300 leading-relaxed mb-4 ml-4">
                <li>jsDelivr (jsdelivr.com) for React libraries</li>
                <li>Tailwind CSS (tailwindcss.com) for the styling framework</li>
                <li>cdnjs (cdnjs.cloudflare.com) for the Three.js library</li>
              </ul>
              <p className="text-gray-300 leading-relaxed">
                When loading these external resources, your IP address is transmitted to the respective providers. The legal basis is Art. 6(1)(f) GDPR (legitimate interest in fast and secure delivery of the website).
              </p>
            </div>

            {/* Your Rights */}
            <div>
              <h2 className="text-2xl font-bold text-white mb-4 border-b-2 border-cyan-500 pb-2">
                6. Your Rights
              </h2>
              <p className="text-gray-300 leading-relaxed mb-4">
                You have the following rights regarding your personal data:
              </p>
              <ul className="list-disc list-inside text-gray-300 leading-relaxed mb-4 ml-4">
                <li><strong>Right of access</strong> (Art. 15 GDPR): You may request information about your stored data.</li>
                <li><strong>Right to rectification</strong> (Art. 16 GDPR): You may request correction of inaccurate data.</li>
                <li><strong>Right to erasure</strong> (Art. 17 GDPR): You may request deletion of your data.</li>
                <li><strong>Right to restriction of processing</strong> (Art. 18 GDPR): You may request restriction of processing.</li>
                <li><strong>Right to data portability</strong> (Art. 20 GDPR): You may receive your data in a structured format.</li>
                <li><strong>Right to object</strong> (Art. 21 GDPR): You may object to the processing of your data.</li>
                <li><strong>Right to withdraw consent</strong>: You may withdraw any consent given at any time.</li>
              </ul>
              <p className="text-gray-300 leading-relaxed">
                To exercise your rights, please contact:
                <a href="mailto:info@wedo-software.com" className="text-cyan-400 hover:text-cyan-300 transition ml-1">
                  info@wedo-software.com
                </a>
              </p>
            </div>

            {/* Right to Complain */}
            <div>
              <h2 className="text-2xl font-bold text-white mb-4 border-b-2 border-cyan-500 pb-2">
                7. Right to Lodge a Complaint
              </h2>
              <p className="text-gray-300 leading-relaxed">
                You have the right to lodge a complaint with a data protection supervisory authority. In Austria, this is the Austrian Data Protection Authority:
                <br /><br />
                Österreichische Datenschutzbehörde<br />
                Barichgasse 40-42<br />
                1030 Vienna<br />
                Phone: +43 1 52 152-0<br />
                Email: dsb@dsb.gv.at<br />
                Website: <a href="https://www.dsb.gv.at" target="_blank" rel="noopener noreferrer" className="text-cyan-400 hover:text-cyan-300 transition">www.dsb.gv.at</a>
              </p>
            </div>

            {/* Data Security */}
            <div>
              <h2 className="text-2xl font-bold text-white mb-4 border-b-2 border-cyan-500 pb-2">
                8. Data Security
              </h2>
              <p className="text-gray-300 leading-relaxed">
                We employ technical and organizational security measures to protect your data against accidental or intentional manipulation, loss, destruction or access by unauthorized persons. Our security measures are continuously improved in line with technological developments.
              </p>
            </div>

            {/* Storage Duration */}
            <div>
              <h2 className="text-2xl font-bold text-white mb-4 border-b-2 border-cyan-500 pb-2">
                9. Storage Duration
              </h2>
              <p className="text-gray-300 leading-relaxed">
                We store personal data only as long as necessary for the respective purpose or as required by statutory retention periods. Once the purpose no longer applies or retention periods expire, the data is routinely deleted.
              </p>
            </div>

            {/* Changes */}
            <div>
              <h2 className="text-2xl font-bold text-white mb-4 border-b-2 border-cyan-500 pb-2">
                10. Changes to this Privacy Policy
              </h2>
              <p className="text-gray-300 leading-relaxed">
                We reserve the right to adapt this privacy policy to reflect changes in the law or changes to our services. The most current version applies to repeat visits.
              </p>
            </div>

          </div>

          {/* Back to Home Button */}
          <div className="text-center mt-12">
            <a
              href="index.html"
              className="inline-block cta-primary text-[#05060a] px-8 py-3 rounded-full font-semibold transition"
            >
              Back to Home
            </a>
          </div>
        </div>
      </section>
    );

    const App = () => (
      <div>
        <Navbar />
        <DatenschutzContent />
        <Footer />
      </div>
    );

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
